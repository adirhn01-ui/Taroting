[package]
name = "taroting"
version = "0.9.0"
description = "Ultra-lightweight, offline desktop video editor"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# The native screen eyedropper (src/screen_pick.rs), and Explorer's own
# natural file-name order for the viewer's folder stepping (StrCmpLogicalW in
# src/media/siblings.rs). Windows-only by construction; the seams are
# per-platform and other platforms get their own. Features are compile-time
# only: no new crate, nothing in Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Keep dev iteration fast but dependencies optimized (compiled once).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
