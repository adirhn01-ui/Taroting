[package]
name = "taroting"
version = "0.9.0"
description = "Ultra-lightweight, offline desktop video editor"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# The native screen eyedropper (src/screen_pick.rs), Explorer's own
# natural file-name order for the viewer's folder stepping (StrCmpLogicalW in
# src/media/siblings.rs), and the crash note a native fault leaves behind
# (src/crash.rs: an unhandled-exception filter that writes with plain Win32
# file calls). Windows-only by construction; the seams are per-platform and
# other platforms get their own. Features are compile-time only: no new
# crate, nothing in Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# WebView2's ProcessFailed event, so a dead page process is reloaded and a
# dead engine restarts the app (src/crash.rs). Already in Cargo.lock at this
# version through wry/tauri — the same crate tauri hands its controller out
# as — so this names it, it adds nothing.
webview2-com = "0.38"
# The COM side of the same seam: the order a File Explorer window shows the
# viewer's folder in (src/media/explorer_order.rs). Already in Cargo.lock at
# this version (webview2-com, tao), so these are features only, no new crate.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Keep dev iteration fast but dependencies optimized (compiled once).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
